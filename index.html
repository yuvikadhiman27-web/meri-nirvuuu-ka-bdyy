<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nirvi!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif; background:#5a0f1a; overflow:hidden; height:100vh}
.slide{position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; padding:15px; background:#5a0f1a}
.slide.active{display:flex; animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.full-img{width:95vw; max-width:420px; max-height:82vh; object-fit:contain; border-radius:15px; box-shadow:0 15px 40px rgba(0,0,0,0.5)}
.btn{background:#f9e4c0; color:#8b1a2e; border:none; padding:13px 30px; border-radius:30px; margin-top:18px; font-weight:bold; cursor:pointer; font-size:15px}
.env-scene{position:relative; width:92vw; max-width:420px; height:55vh; display:flex; align-items:center; justify-content:center}
.env-img{width:100%; max-width:380px; z-index:2; transition:0.6s; border-radius:12px; cursor:pointer}
.letter-pop{position:absolute; width:85%; max-width:340px; top:18%; left:50%; transform:translate(-50%,0) rotate(4deg); z-index:1; border-radius:10px; box-shadow:0 8px 25px rgba(0,0,0,0.4); transition:0.8s cubic-bezier(0.34,1.56,0.64,1); border:3px solid #fff}
.env-scene.open .env-img{transform:translateY(90px) scale(0.88)}
.env-scene.open .letter-pop{transform:translate(-50%,-22%) rotate(0deg) scale(1.08); z-index:5; top:0}
</style>
</head>
<body>
<div class="slide active" id="s1"><img src="slide1.jpg" class="full-img"><button class="btn" onclick="go(2)">open your letter → 💌</button></div>
<div class="slide" id="s2"><div class="env-scene" id="env" onclick="openIt()"><img src="slide2.jpg" class="letter-pop"><img src="envelope.png.jpeg" class="env-img"></div><p style="color:#f9e4c0;margin-top:20px" id="hint">tap the lily envelope to POP it 💖</p><button class="btn" id="b2" style="display:none" onclick="go(3)">read full letter →</button></div>
<div class="slide" id="s3"><img src="slide2.jpg" class="full-img"><button class="btn" onclick="go(4)">one more letter →</button></div>
<div class="slide" id="s4"><img src="slide3.jpg" class="full-img"><button class="btn" onclick="go(5)">last surprise → 🎂</button></div>
<div class="slide" id="s5"><img src="slide4.jpg" class="full-img"><div style="margin-top:20px;font-size:42px">🎉✨💖</div><h2 style="color:#f9e4c0;margin-top:12px;text-align:center">Happy Birthday meri kuchupuchu!!</h2></div>
<script>
function go(n){document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));document.getElementById('s'+n).classList.add('active')}
function openIt(){document.getElementById('env').classList.add('open');document.getElementById('hint').innerText='OMG IT POPPED!! 😭💖';document.getElementById('b2').style.display='block'}
</script>
</body>
</html>
